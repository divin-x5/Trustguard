<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TrustGuard">
  <defs>
    <linearGradient id="tgShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b36e"/>
    </linearGradient>
    <linearGradient id="tgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="tgIris">
      <stop offset="0" stop-color="#eafff5"/>
      <stop offset="0.55" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b36e"/>
    </radialGradient>
  </defs>

  <!-- shield body -->
  <path d="M32 4 L56 13 V32 C56 47 45.5 56.5 32 61 C18.5 56.5 8 47 8 32 V13 Z"
        fill="url(#tgFill)" stroke="url(#tgShield)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- circuit traces -->
  <g stroke="#00ff9c" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".45">
    <path d="M18 25 h8"/>
    <path d="M38 25 h8"/>
    <path d="M18 35 h28"/>
    <path d="M24 43 h6"/>
    <path d="M34 43 h6"/>
  </g>
  <g fill="#00ff9c" opacity=".7">
    <circle cx="26" cy="25" r="1.4"/>
    <circle cx="38" cy="25" r="1.4"/>
    <circle cx="46" cy="35" r="1.4"/>
  </g>

  <!-- scan eye -->
  <circle cx="32" cy="30" r="7" fill="#050807" opacity=".55"/>
  <circle cx="32" cy="30" r="7" fill="none" stroke="#00ff9c" stroke-width="2.2"/>
  <circle cx="32" cy="30" r="3" fill="url(#tgIris)"/>
  <circle cx="32" cy="30" r="1.2" fill="#050807"/>

  <!-- verification check -->
  <path d="M26 48 l4.5 4.5 L40 43" stroke="#00ff9c" stroke-width="2.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
